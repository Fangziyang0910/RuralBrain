<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乡村智慧系统门户 - Rural Intelligence Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 乡村绿色调调色板 */
            --primary-bg: #064e3b;
            /* 深森林绿 */
            --accent-green: #10b981;
            /* 活力绿 */
            --soft-green: #34d399;
            --leaf-green: #059669;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ecfdf5;
            --text-dim: #a7f3d0;
            --glow-color: rgba(16, 185, 129, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: var(--primary-bg);
            /* 更有生命感的径向渐变，模拟林间光影 */
            background-image:
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(52, 211, 153, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(6, 78, 59, 1) 0%, #022c22 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 粒子画布 */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 鼠标跟随光晕 */
        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: opacity 0.3s ease;
            mix-blend-mode: screen;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            padding: 40px 0;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        header {
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s forwards ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            /* 渐变文案：从亮白到嫩绿 */
            background: linear-gradient(135deg, #ffffff 0%, #6ee7b7 50%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(16, 185, 129, 0.3);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.1);
            }
        }

        p.subtitle {
            font-size: 1.3rem;
            color: var(--text-dim);
            max-width: 700px;
            margin: 0 auto;
            font-weight: 300;
            letter-spacing: 1px;
            position: relative;
        }

        p.subtitle::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 40px;
            width: 100%;
            perspective: 1000px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px 40px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transform-style: preserve-3d;
            opacity: 0;
            animation: cardFadeIn 0.8s forwards ease-out;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 32px;
            padding: 2px;
            background: linear-gradient(135deg,
                rgba(16, 185, 129, 0.3),
                transparent 50%,
                rgba(52, 211, 153, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--soft-green);
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(16, 185, 129, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.12);
        }

        /* 卡片内容层级 - 用于3D效果 */
        .card-content {
            transform: translateZ(30px);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 鼠标悬停时的光晕效果 */
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(110, 231, 183, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .card:hover::after {
            opacity: 1;
        }

        /* 点击涟漪效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnimation 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnimation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .icon-container {
            position: relative;
            margin-bottom: 30px;
        }

        .icon-box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.15));
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .icon-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .card:hover .icon-box {
            transform: scale(1.1) rotate(-5deg);
            background: linear-gradient(135deg, rgba(110, 231, 183, 0.3), rgba(16, 185, 129, 0.2));
            border-color: rgba(110, 231, 183, 0.5);
            box-shadow:
                0 15px 40px rgba(16, 185, 129, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .card:hover .icon-box::before {
            transform: translateX(100%);
        }

        .icon-box img {
            max-width: 55px;
            max-height: 55px;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        .icon-box svg {
            width: 50px;
            height: 50px;
            color: var(--accent-green);
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 2px 8px rgba(16, 185, 129, 0.3));
        }

        .card-title {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .card-desc {
            font-size: 1rem;
            color: var(--text-dim);
            line-height: 1.8;
            font-weight: 400;
            text-align: center;
        }

        .btn-enter {
            margin-top: 30px;
            padding: 14px 35px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid var(--glass-border);
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-enter::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-green), var(--leaf-green));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover .btn-enter {
            transform: scale(1.05);
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }

        .card:hover .btn-enter::before {
            opacity: 1;
        }

        .btn-enter span {
            position: relative;
            z-index: 1;
        }

        .btn-enter::after {
            content: '→';
            font-size: 1.2rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 1;
        }

        .card:hover .btn-enter::after {
            transform: translateX(8px);
        }

        /* 装饰性背景叶子 */
        .leaf-decoration {
            position: fixed;
            pointer-events: none;
            opacity: 0.03;
            z-index: 0;
            font-size: 200px;
        }

        .leaf-1 { top: 10%; left: 5%; transform: rotate(-15deg); }
        .leaf-2 { bottom: 20%; right: 10%; transform: rotate(20deg); }
        .leaf-3 { top: 50%; left: 50%; transform: rotate(45deg); }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(40px) rotateX(10deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .card:nth-child(3) {
            animation-delay: 0.6s;
        }

        /* 页脚 */
        footer {
            margin-top: 60px;
            padding: 30px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
            opacity: 0;
            animation: fadeIn 1s 1s forwards ease-out;
        }

        footer a {
            color: var(--soft-green);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #fff;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            p.subtitle {
                font-size: 1.1rem;
            }

            .portal-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .card {
                padding: 40px 30px;
            }

            .cursor-glow {
                display: none;
            }
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- 粒子画布 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 鼠标跟随光晕 -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- 装饰叶子 -->
    <div class="leaf-decoration leaf-1">🌿</div>
    <div class="leaf-decoration leaf-2">🍃</div>
    <div class="leaf-decoration leaf-3">🌱</div>

    <div class="container">
        <header>
            <h1>乡村智慧数字化门户</h1>
            <p class="subtitle">数字赋能，绘就大美乡村振兴新画卷</p>
        </header>

        <div class="portal-grid">
            <!-- 乡村智慧大脑 -->
            <a href="#" class="card" id="link-brain">
                <div class="card-content">
                    <div class="icon-container">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                                <circle cx="12" cy="12" r="2"/>
                            </svg>
                        </div>
                    </div>
                    <h2 class="card-title">乡村智慧大脑</h2>
                    <p class="card-desc">全方位感知乡村动态，汇聚农业、治理、环境数据，实现乡村运行"一屏统揽、一键触发"。</p>
                    <div class="btn-enter">
                        <span>立即进入</span>
                    </div>
                </div>
            </a>

            <!-- 乡村经营智能体WAI -->
            <a href="#" class="card" id="link-wai">
                <div class="card-content">
                    <div class="icon-container">
                        <div class="icon-box" style="background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));">
                            <img src="images/wai-logo (1).png" alt="WAI Logo"
                                onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2310b981%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/><path d=%22M12 6v6l4 2%22/><circle cx=%2212%22 cy=%2212%22 r=%222%22/></svg>'">
                        </div>
                    </div>
                    <h2 class="card-title">乡村经营智能体 WAI</h2>
                    <p class="card-desc">您的智慧农业"大管家"。提供市场行情分析、种植决策建议与数字化财务管理，助力集体经济腾飞。</p>
                    <div class="btn-enter">
                        <span>立即进入</span>
                    </div>
                </div>
            </a>

            <!-- 乡村智能规划智能体 -->
            <a href="#" class="card" id="link-plan">
                <div class="card-content">
                    <div class="icon-container">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                <polyline points="9 22 9 12 15 12 15 22" />
                            </svg>
                        </div>
                    </div>
                    <h2 class="card-title">乡村智能规划智能体</h2>
                    <p class="card-desc">AI驱动的乡村规划站。一键生成现状分析与科学规划报告，让每一寸土地焕发科技魅力。</p>
                    <div class="btn-enter">
                        <span>立即进入</span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 乡村智慧数字化平台 | 科技助力乡村振兴</p>
    </footer>

    <script>
        // 配置跳转链接
        const config = {
            brain: 'http://localhost:3001',  // 乡村智慧大脑 - 跳转到 Next.js 聊天界面
            wai: 'javascript:alert("乡村经营智能体WAI 接入中...")',
            plan: 'javascript:alert("乡村智能规划智能体 接入中...")'
        };

        // 绑定跳转
        document.getElementById('link-brain').href = config.brain;
        document.getElementById('link-wai').href = config.wai;
        document.getElementById('link-plan').href = config.plan;

        // ============ 粒子系统 ============
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.pulse = Math.random() * Math.PI * 2;
                this.pulseSpeed = 0.02 + Math.random() * 0.02;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.pulse += this.pulseSpeed;

                // 脉冲效果
                this.currentOpacity = this.opacity * (0.5 + Math.sin(this.pulse) * 0.5);

                // 边界检查
                if (this.x < 0 || this.x > canvas.width ||
                    this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(16, 185, 129, ${this.currentOpacity})`;
                ctx.fill();

                // 发光效果
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(16, 185, 129, ${this.currentOpacity * 0.3})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.min(80, Math.floor((canvas.width * canvas.height) / 15000));
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        const opacity = (1 - distance / 150) * 0.15;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(16, 185, 129, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            connectParticles();
            animationId = requestAnimationFrame(animateParticles);
        }

        // ============ 鼠标跟随光晕 ============
        const cursorGlow = document.getElementById('cursorGlow');
        let mouseX = 0, mouseY = 0;
        let glowX = 0, glowY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function updateCursorGlow() {
            // 平滑跟随
            glowX += (mouseX - glowX) * 0.1;
            glowY += (mouseY - glowY) * 0.1;

            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';

            requestAnimationFrame(updateCursorGlow);
        }

        // ============ 卡片3D倾斜效果 ============
        const cards = document.querySelectorAll('.card');

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = (y - centerY) / 10;
                const rotateY = (centerX - x) / 10;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px) scale(1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0) scale(1)';
            });

            // 涟漪效果
            card.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');

                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';

                this.appendChild(ripple);

                setTimeout(() => ripple.remove(), 600);
            });
        });

        // ============ 初始化 ============
        window.addEventListener('load', () => {
            // 隐藏加载动画
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 500);

            // 初始化粒子系统
            resizeCanvas();
            initParticles();
            animateParticles();
            updateCursorGlow();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });
    </script>
</body>

</html>
