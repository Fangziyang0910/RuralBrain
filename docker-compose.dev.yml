# RuralBrain 开发环境 Docker Compose 配置
# 使用 ONNX Runtime + 开发模式前端

services:
  # 前端服务 (Next.js 开发模式)
  frontend:
    image: zwxdockerbeginner/ruralbrain:frontend-onnx-v3
    container_name: ruralbrain-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://backend:8081
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 后端主服务
  backend:
    image: zwxdockerbeginner/ruralbrain:backend-onnx-v3
    container_name: ruralbrain-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - PEST_DETECTION_API_URL=http://detection-service:8001/detection/pest/detect
      - RICE_DETECTION_API_URL=http://detection-service:8001/detection/rice/predict
      - COW_DETECTION_API_URL=http://detection-service:8001/detection/cow/detect
    volumes:
      # knowledge_base 已内置在镜像中，无需挂载
      - ./src/rag:/app/src/rag
      - ./service:/app/service
      - ./src/agents:/app/src/agents
      - ./src/utils:/app/src/utils
      - ./src/config.py:/app/src/config.py
      - ./src/data:/app/src/data
      # 知识库目录映射（开发环境）
      - ./knowledge_base:/app/knowledge_base
    tmpfs:
      - /tmp/ruralbrain:size=500M,mode=0777
    depends_on:
      - detection-service
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 检测服务
  detection-service:
    image: zwxdockerbeginner/ruralbrain:detection-onnx-v3
    container_name: ruralbrain-detection-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app/algorithms
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src/algorithms:/app/algorithms
    restart: unless-stopped
    networks:
      - ruralbrain-network

networks:
  ruralbrain-network:
    driver: bridge
    name: ruralbrain-network
