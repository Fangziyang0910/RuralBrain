[project]
name = "ruralbrain"
version = "0.1.0"
description = "乡村复杂决策系统智慧大脑"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=1.1.0",
    "langchain-deepseek>=1.0.0",
    "langgraph>=1.0.4",
    "langsmith>=0.4.38",
    "requests>=2.31.0",
    # 害虫检测API依赖
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "python-multipart>=0.0.6",
    # 图像处理和深度学习依赖
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.20.0",
    # ultralytics 用于加载 ONNX 模型进行推理（不依赖 torch）
    "ultralytics>=8.0.0",
    # RAG 知识库依赖
    "langchain-chroma>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "python-pptx>=1.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "filetype>=1.2.0",
    "rich>=13.0.0",
    "cachetools>=5.0.0",
    "markitdown>=0.1.5",
    "langchain-community",
    "sentence-transformers",
    "tavily-python>=0.7.23",
    "langchain-tavily>=0.1.0",
    # 阿里云百炼 Embedding API
    "dashscope>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "aiohttp>=3.9.0",
]
