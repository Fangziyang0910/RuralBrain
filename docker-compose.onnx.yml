# RuralBrain 轻量级 Docker Compose 配置
# 使用 ONNX Runtime 进行推理，减少依赖和镜像体积

services:
  # 前端服务 (Next.js)
  frontend:
    image: zwxdockerbeginner/ruralbrain:frontend-onnx-v2
    container_name: ruralbrain-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 后端主服务 (FastAPI + Agents)
  backend:
    image: zwxdockerbeginner/ruralbrain:backend-onnx-v2
    container_name: ruralbrain-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      # 检测服务 API 地址（使用统一网关路由前缀 /detection）
      - PEST_DETECTION_API_URL=http://detection-service:8001/detection/pest/detect
      - RICE_DETECTION_API_URL=http://detection-service:8001/detection/rice/predict
      - COW_DETECTION_API_URL=http://detection-service:8001/detection/cow/detect
    volumes:
      # knowledge_base 已内置在镜像中，无需挂载
      - ./src/rag:/app/src/rag
      - ./service:/app/service
      - ./src/agents:/app/src/agents
      - ./src/utils:/app/src/utils
      - ./src/config.py:/app/src/config.py
    # 使用 tmpfs 存储临时文件（内存存储，容器重启自动清空）
    tmpfs:
      - /tmp/ruralbrain:size=500M,mode=0777
    depends_on:
      - detection-service
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 检测服务（整合病虫害、大米、奶牛等多种检测算法）
  # 使用 ONNX Runtime 进行推理，无需 PyTorch
  detection-service:
    image: zwxdockerbeginner/ruralbrain:detection-onnx-v2
    container_name: ruralbrain-detection-service
    ports:
      - "8001:8001"  # 检测服务端口
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app/algorithms
    volumes:
      # 仅挂载 ONNX 模型文件
      - ./src/algorithms/detection/models:/app/algorithms/detection/models:ro
    restart: unless-stopped
    networks:
      - ruralbrain-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

networks:
  ruralbrain-network:
    driver: bridge
    name: ruralbrain-network
