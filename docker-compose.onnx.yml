# RuralBrain 轻量级 Docker Compose 配置
# 使用 ONNX Runtime 进行推理，减少依赖和镜像体积

services:
  # 前端服务 (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile.frontend.onnx
    container_name: ruralbrain-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 后端主服务 (FastAPI + Agents)
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend.onnx
    container_name: ruralbrain-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - PLANNING_SERVICE_URL=http://planning-service:8003
      # 检测服务 API 地址（使用统一网关路由前缀 /detection）
      - PEST_DETECTION_API_URL=http://detection-service:8001/detection/pest/detect
      - RICE_DETECTION_API_URL=http://detection-service:8001/detection/rice/predict
      - COW_DETECTION_API_URL=http://detection-service:8001/detection/cow/detect
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
    # 使用 tmpfs 存储临时文件（内存存储，容器重启自动清空）
    tmpfs:
      - /tmp/ruralbrain:size=500M,mode=0777
    depends_on:
      - detection-service
      - planning-service
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 检测服务（整合病虫害、大米、奶牛等多种检测算法）
  # 使用 ONNX Runtime 进行推理，无需 PyTorch
  detection-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.detection.onnx
    container_name: ruralbrain-detection-service
    ports:
      - "8001:8001"  # 检测服务端口
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app/algorithms
    volumes:
      # 仅挂载 ONNX 模型文件
      - ./src/algorithms/detection/models:/app/algorithms/detection/models:ro
    restart: unless-stopped
    networks:
      - ruralbrain-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # 规划咨询服务 (Planning Service)
  planning-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.planning.onnx
    container_name: ruralbrain-planning-service
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - SERVICE_PORT=8003
      - SERVICE_HOST=0.0.0.0
      - MODEL_PROVIDER=${MODEL_PROVIDER:-deepseek}
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
    restart: unless-stopped
    networks:
      - ruralbrain-network

networks:
  ruralbrain-network:
    driver: bridge
    name: ruralbrain-network
