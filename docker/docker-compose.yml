# RuralBrain Docker Compose 配置
# 包含前端、后端主服务以及所有检测算法服务

services:
  # 前端服务 (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ruralbrain-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ruralbrain-network

  # 后端主服务 (FastAPI + Agents)
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ruralbrain-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - PLANNING_SERVICE_URL=http://planning-service:8003
      # 检测服务 API 地址（使用统一网关路由前缀 /detection）
      - PEST_DETECTION_API_URL=http://detection-service:8001/detection/pest/detect
      - RICE_DETECTION_API_URL=http://detection-service:8001/detection/rice/predict
      - COW_DETECTION_API_URL=http://detection-service:8001/detection/cow/detect
    volumes:
      - ../uploads:/app/uploads
      - ../pest_results:/app/pest_results
      - ../cow_results:/app/cow_results
      - ../rice_results:/app/rice_results
      - ../knowledge_base:/app/knowledge_base:ro
      - ../src:/app/src:ro
      - ../service:/app/service:ro
      - ../run_server.py:/app/run_server.py:ro
    depends_on:
      - detection-service
      - planning-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ruralbrain-network

  # 检测服务（整合病虫害、大米、奶牛等多种检测算法）
  # 新架构：FastAPI 网关 + 独立算法模块
  detection-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.detector
    container_name: ruralbrain-detection-service
    ports:
      - "8001:8001"  # 检测服务端口
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app/algorithms
    volumes:
      - ../src/algorithms/detection/models:/app/algorithms/detection/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    networks:
      - ruralbrain-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # 规划咨询服务 (Planning Service)
  planning-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.planning
    container_name: ruralbrain-planning-service
    ports:
      - "8003:8003"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - SERVICE_PORT=8003
      - SERVICE_HOST=0.0.0.0
      - MODEL_PROVIDER=${MODEL_PROVIDER:-deepseek}
    volumes:
      - ../knowledge_base:/app/knowledge_base
      - ../src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ruralbrain-network

networks:
  ruralbrain-network:
    driver: bridge
    name: ruralbrain-network
