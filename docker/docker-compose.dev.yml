# RuralBrain 开发环境 Docker Compose 配置
# 支持所有服务的热重载功能
services:
  # 前端开发服务
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend.dev
    image: ruralbrain-frontend
    container_name: ruralbrain-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    volumes:
      - ../frontend:/app                     # 挂载整个前端目录
      - /app/node_modules                     # 容器内依赖（不覆盖）
      - /app/.next                            # 构建缓存（不覆盖）
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 后端主服务
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    image: ruralbrain-backend
    container_name: ruralbrain-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - PLANNING_SERVICE_URL=http://planning-service:8003
      - PYTHONPATH=/app
    volumes:
      - ../service:/app/service                    # 服务代码
      - ../src:/app/src                            # 源代码
      - ../run_server.py:/app/run_server.py        # 启动脚本
      - ../pyproject.toml:/app/pyproject.toml      # 依赖配置
      - ../uv.lock:/app/uv.lock                    # 依赖锁文件
      - ../uploads:/app/uploads                    # 上传目录
      - ../pest_results:/app/pest_results          # 病虫害检测结果
      - ../cow_results:/app/cow_results            # 奶牛检测结果
      - ../rice_results:/app/rice_results          # 大米检测结果
    command: ["uv", "run", "python", "run_server.py"]
    depends_on:
      - triple-detector
      - planning-service
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 三合一检测服务（开发模式）
  triple-detector:
    build:
      context: ../
      dockerfile: docker/Dockerfile.detector.dev
    image: ruralbrain-triple-detector
    container_name: ruralbrain-triple-detector-dev
    ports:
      - "8001:8001"
      - "8081:8081"
      - "8002:8002"
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
    volumes:
      - ../src/algorithms/pest_detection/detector:/app/pest
      - ../src/algorithms/rice_detection/detector:/app/rice
      - ../src/algorithms/cow_detection/detector:/app/cow
      - ../src/algorithms/pest_detection/detector/models:/app/pest/models:ro
      - ../src/algorithms/rice_detection/detector/models:/app/rice/models:ro
      - ../src/algorithms/cow_detection/detector/models:/app/cow/models:ro
      - ../src/algorithms/triple_detector/start_all_dev.sh:/app/start_all_dev.sh
    command: ["bash", "/app/start_all_dev.sh"]
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 规划咨询服务（开发模式）
  planning-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.planning.dev
    image: ruralbrain-planning-service
    container_name: ruralbrain-planning-service-dev
    ports:
      - "8003:8003"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - SERVICE_PORT=8003
      - SERVICE_HOST=0.0.0.0
      - MODEL_PROVIDER=${MODEL_PROVIDER:-deepseek}
      - PYTHONPATH=/app
    volumes:
      - ../src/rag:/app/src/rag                    # RAG 源代码
      - ../knowledge_base:/app/knowledge_base      # 知识库
      - ../pyproject.toml:/app/pyproject.toml      # 依赖配置
      - ../uv.lock:/app/uv.lock                    # 依赖锁文件
    command: ["uv", "run", "uvicorn", "src.rag.service.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    restart: unless-stopped
    networks:
      - ruralbrain-network

networks:
  ruralbrain-network:
    driver: bridge
    name: ruralbrain-network
