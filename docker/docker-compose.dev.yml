# RuralBrain 开发环境 Docker Compose 配置
# 支持所有服务的热重载功能
services:
  # 前端开发服务
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend.dev
    image: ruralbrain-frontend
    container_name: ruralbrain-frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    volumes:
      - ../frontend:/app                     # 挂载整个前端目录
      - /app/node_modules                     # 容器内依赖（不覆盖）
      - /app/.next                            # 构建缓存（不覆盖）
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 后端主服务
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    image: ruralbrain-backend
    container_name: ruralbrain-backend
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - PLANNING_SERVICE_URL=http://planning-service:8003
      - PYTHONPATH=/app
      - MAX_CACHE_SIZE=400
    volumes:
      - ../service:/app/service                    # 服务代码
      - ../src:/app/src                            # 源代码
      - ../run_server.py:/app/run_server.py        # 启动脚本
      - ../pyproject.toml:/app/pyproject.toml      # 依赖配置
      - ../uv.lock:/app/uv.lock                    # 依赖锁文件
    # 使用 tmpfs 存储临时文件（内存存储，容器重启自动清空）
    tmpfs:
      - /tmp/ruralbrain:size=500M,mode=0777
    command: ["uv", "run", "uvicorn", "service.server:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]
    depends_on:
      - detection-service
      - planning-service
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 检测服务（开发模式 - 支持热重载）
  # 新架构：FastAPI 网关 + 独立算法模块
  detection-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.detector.dev
    image: ruralbrain-detection-service
    container_name: ruralbrain-detection-service-dev
    ports:
      - "8001:8001"  # 检测服务端口
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/algorithms
    volumes:
      - ../src/algorithms:/app/algorithms  # 算法服务代码（热重载，包含 api/ 和 detection/）
    # 命令在 Dockerfile 中通过 CMD 指定（使用 --reload）
    restart: unless-stopped
    networks:
      - ruralbrain-network

  # 规划咨询服务（开发模式）
  planning-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.planning.dev
    image: ruralbrain-planning-service
    container_name: ruralbrain-planning-service-dev
    ports:
      - "8003:8003"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - SERVICE_PORT=8003
      - SERVICE_HOST=0.0.0.0
      - MODEL_PROVIDER=${MODEL_PROVIDER:-deepseek}
      - PYTHONPATH=/app
    volumes:
      - ../src/rag:/app/src/rag                    # RAG 源代码
      - ../src/utils:/app/src/utils                # 工具模块（新增）
      - ../src/config.py:/app/src/config.py        # 配置文件（新增）
      - ../knowledge_base:/app/knowledge_base      # 知识库
      - ../pyproject.toml:/app/pyproject.toml      # 依赖配置
      - ../uv.lock:/app/uv.lock                    # 依赖锁文件
    command: ["uv", "run", "uvicorn", "src.rag.service.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    restart: unless-stopped
    networks:
      - ruralbrain-network

networks:
  ruralbrain-network:
    driver: bridge
    name: ruralbrain-network
